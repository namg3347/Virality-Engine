spring:
  application:
    name: virality


  datasource:
    url: jdbc:postgresql://localhost:5433/virality_db?options=-c%20TimeZone=UTC
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6380